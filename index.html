<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Move Me: your move plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#F5F5F8; --card:#FFFFFF; --ink:#24262E; --muted:#6B6E7B; --line:#D9DAE6;
  --navy:#1E2761; --navy-deep:#161C4D; --on-navy:#FFFFFF; --on-navy-muted:#C5C9EC;
  --coral:#F96167; --coral-text:#B8363D; --tint:#D9DCF5; --good:#2F7D5B; --sun:#F9E795;
  --serif:"Source Serif 4", Cambria, Georgia, "Times New Roman", serif;
  --sans:Carlito, Calibri, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121633; --surface:#1A1F45; --card:#1D2350; --ink:#ECEDF5; --muted:#A6A9C2; --line:#2F3668;
    --navy:#161C4D; --navy-deep:#0F1438; --on-navy-muted:#AEB3DE; --coral-text:#FF8A8F; --tint:#2B3275; --good:#6FD0A5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121633; --surface:#1A1F45; --card:#1D2350; --ink:#ECEDF5; --muted:#A6A9C2; --line:#2F3668;
  --navy:#161C4D; --navy-deep:#0F1438; --on-navy-muted:#AEB3DE; --coral-text:#FF8A8F; --tint:#2B3275; --good:#6FD0A5;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 20px}

.mark{background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:20px;color:var(--on-navy)}
.mark i{width:28px;height:28px;border-radius:50%;background:var(--coral);display:grid;place-items:center}
.mark i::after{content:"";width:14px;height:14px;border-radius:50%;border:3px solid var(--navy-deep);box-shadow:inset 0 0 0 3px var(--coral),inset 0 0 0 7px var(--navy-deep)}

/* Setup screen */
.setup{background:var(--navy);color:var(--on-navy);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.setup-top{padding:24px 0}
.setup-main{flex:1;display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center;padding-bottom:56px}
.setup h1{font-size:clamp(34px,5vw,54px);max-width:14ch;letter-spacing:-.01em}
.setup .lede{color:var(--on-navy-muted);font-size:19px;max-width:40ch;margin:18px 0 28px}
.promise{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.promise li{display:flex;gap:12px;align-items:baseline;color:var(--on-navy)}
.promise li::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--coral);transform:translateY(-2px)}
.form-card{background:var(--card);color:var(--ink);border-radius:16px;padding:28px;box-shadow:0 24px 60px rgba(6,10,40,.35)}
.form-card h2{font-size:24px;margin-bottom:4px}
.form-card .hint{color:var(--muted);margin:0 0 20px;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:14px;font-weight:700;color:var(--muted)}
.field input,.field select{height:46px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--surface);width:100%}
.field input:focus,.field select:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px var(--tint)}
.field .err{color:var(--coral-text);font-size:14px;min-height:0}
.field.bad input,.field.bad select{border-color:var(--coral-text)}
.fit-row{display:flex;flex-wrap:wrap;gap:0 10px;align-items:flex-start}
.fit-row .field{flex:0 0 auto}
.fit-row .field input,.fit-row .field select{width:auto;padding:0 10px}
.field.fit input{width:auto;align-self:flex-start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:8px;border:0;cursor:pointer;font-weight:700}
.btn-coral{background:var(--coral);color:var(--navy-deep);width:100%;font-size:18px}
.btn-coral:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent;color:var(--on-navy);border:1px solid rgba(255,255,255,.35);height:40px;padding:0 16px}
.btn-ghost:hover{background:rgba(255,255,255,.08)}
.top-actions{display:flex;align-items:center;gap:10px}
.hello{color:var(--on-navy-muted);margin-right:4px}
.optin{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--muted);margin:2px 0 18px;cursor:pointer}
.optin input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--navy);flex:none}
.steps{color:var(--on-navy-muted);font-size:15px;margin:0 0 14px}
.fineprint{font-size:13px;color:var(--muted);margin:14px 0 0;text-align:center}

/* Plan screen */
.topbar{background:var(--navy);color:var(--on-navy)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:16px;padding-bottom:16px}
.hero{background:var(--navy);color:var(--on-navy);padding:8px 0 40px}
.route{font-family:var(--serif);font-size:clamp(28px,4.4vw,44px);font-weight:700;display:flex;flex-wrap:wrap;align-items:baseline;gap:.35em}
.route .to{color:var(--coral)}
.route .arrow{color:var(--on-navy-muted);font-weight:600}
.route-meta{color:var(--on-navy-muted);margin-top:6px}
.stats{display:grid;grid-template-columns:1fr 2fr 1fr;gap:16px;margin-top:28px}
.stat{background:var(--navy-deep);border-radius:12px;padding:18px 20px}
.stat .k{font-size:14px;color:var(--on-navy-muted)}
.stat .v{font-family:var(--serif);font-size:34px;font-weight:700;line-height:1.1;margin-top:4px}
.stat .v small{font-family:var(--sans);font-size:15px;font-weight:400;color:var(--on-navy-muted)}
.meter{height:14px;border-radius:7px;background:rgba(255,255,255,.12);margin-top:12px;overflow:hidden;display:flex}
.meter .spent{background:var(--coral);height:100%;transition:width .4s ease}
.meter .proj{height:100%;background:repeating-linear-gradient(135deg,rgba(249,97,103,.55) 0 4px,rgba(249,97,103,.2) 4px 8px);transition:width .4s ease}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--on-navy-muted);margin-top:10px}
.legend b{color:var(--on-navy);font-weight:700}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.over{color:var(--sun);font-weight:700}

.plan{padding:36px 0 64px}
.plan-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.plan-head h2{font-size:28px}
.plan-head p{margin:0;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.task{display:grid;grid-template-columns:96px 28px 1fr;gap:0 14px;position:relative}
.task::before{content:"";position:absolute;left:calc(96px + 14px + 13px);top:0;bottom:0;width:2px;background:var(--line)}
.task:first-child::before{top:26px}
.task:last-child::before{bottom:calc(100% - 26px)}
.when{text-align:right;padding-top:14px}
.when .d{font-family:var(--serif);font-weight:700;font-size:18px}
.when .r{font-size:13px;color:var(--muted)}
.when .r.late{color:var(--coral-text);font-weight:700}
.dot{position:relative;z-index:1;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--muted);margin:19px auto 0}
.task.next .dot{border-color:var(--coral);background:var(--coral);box-shadow:0 0 0 5px color-mix(in srgb,var(--coral) 25%,transparent)}
.task.done .dot{border-color:var(--good);background:var(--good)}
.task.moveday .dot{width:22px;height:22px;margin-top:16px;border-color:var(--navy);background:var(--navy)}
:root[data-theme="dark"] .task.moveday .dot{border-color:var(--coral)}
.body{padding:8px 0 18px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.task.moveday .card{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.task.moveday .card .sub,.task.moveday .est .lbl{color:var(--on-navy-muted)}
.row{display:flex;align-items:flex-start;gap:14px;padding:14px 16px}
.check{flex:none;appearance:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;margin:2px 0 0;cursor:pointer;display:grid;place-items:center;background:var(--card)}
.check:checked{background:var(--good);border-color:var(--good)}
.check:checked::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task.moveday .check{background:transparent;border-color:var(--on-navy-muted)}
.main{flex:1;min-width:0}
.title{font-weight:700;font-size:18px;line-height:1.3}
.task.done .title{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.sub{color:var(--muted);font-size:15px;margin-top:2px}
.sub .chosen{color:var(--ink);font-weight:700}
.est{flex:none;text-align:right;font-size:15px}
.est .amt{font-weight:700;font-size:18px}
.est .lbl{color:var(--muted);font-size:13px}
.toggle{background:none;border:0;padding:0;margin-top:8px;color:var(--navy);font-weight:700;cursor:pointer;font-size:15px;text-decoration:underline;text-underline-offset:3px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toggle{color:var(--coral)}}
:root[data-theme="dark"] .toggle{color:var(--coral)}
.main-text{cursor:default}
.main-text[role="button"]{cursor:pointer;border-radius:8px;margin:-4px -6px;padding:4px 6px}
.main-text[role="button"]:hover{background:var(--surface)}
.main-text[role="button"]:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.tag{display:inline-block;background:var(--line);color:var(--muted);font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;vertical-align:1px}
.swap-hint{margin:2px 6px 8px;color:var(--muted);font-size:13px}
.swap-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:4px 6px 2px}
.swap-row .btn{width:auto;padding:0 16px;height:40px}
.shortlist .hint{margin:2px 6px 6px;color:var(--muted);font-size:13px}
.shortlist{border-top:1px solid var(--line);background:var(--surface);padding:6px 10px 10px}
.shortlist fieldset{border:0;margin:0;padding:0}
.shortlist legend{font-size:13px;color:var(--muted);padding:8px 6px 6px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:10px;cursor:pointer;border:2px solid transparent}
.opt:hover{background:var(--card)}
.opt input{margin:4px 0 0;accent-color:var(--navy);width:18px;height:18px;flex:none}
.opt.sel{background:var(--card);border-color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt.sel{border-color:var(--coral)}}
:root[data-theme="dark"] .opt.sel{border-color:var(--coral)}
.opt .n{font-weight:700}
.opt .desc{font-size:14px;color:var(--muted)}
.opt .meta{font-size:13px;color:var(--muted);margin-top:2px}
.opt .price{margin-left:auto;font-weight:700;font-size:17px;white-space:nowrap}
.clear{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:6px;text-decoration:underline}
.badge{display:inline-block;background:var(--good);color:#fff;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;margin-right:4px;vertical-align:1px}
.badge.pending{background:var(--sun);color:var(--navy-deep)}
.conf-list .code small.confirmed{color:var(--good)}
#modal-root:empty{display:none}
.confirm-backdrop{position:fixed;inset:0;background:rgba(15,20,56,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:999}
.confirm-box{background:var(--card);color:var(--ink);border-radius:14px;max-width:420px;width:100%;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.confirm-box h2{font-family:var(--serif);font-size:20px;margin:0 0 10px}
.confirm-box p{margin:0;color:var(--muted);line-height:1.5}
.confirm-actions{display:flex;gap:10px;margin-top:20px}
.confirm-actions .btn{flex:1;width:auto}
.btn-line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-danger{background:var(--coral-text);color:#fff}
.addtask{margin-top:22px;padding:16px 18px;border:1px dashed var(--line);border-radius:12px}
.addtask h3{font-size:18px;margin:0 0 4px;font-family:var(--serif)}
.addtask .hint{margin:0 0 10px;color:var(--muted);font-size:14px}
.addrow{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px}
.addrow input{height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--card);color:var(--ink);min-width:0;font-family:var(--sans);font-size:15px}
.addtask .err{display:block;color:var(--coral-text);font-size:14px;margin-top:6px}
@media (max-width:560px){.addrow{grid-template-columns:1fr 1fr}.addrow input:first-child{grid-column:1/-1}}
:root[data-theme="dark"] .badge{color:#0F1438}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge{color:#0F1438}}
.next-card{margin:28px 0 32px;background:var(--navy);color:var(--on-navy);border-radius:16px;padding:26px 28px;display:grid;grid-template-columns:1fr auto;gap:18px 28px;align-items:center}
.next-card h2{font-size:26px}
.next-card p{margin:6px 0 0;color:var(--on-navy-muted);max-width:60ch}
.next-card .btn-coral{width:auto;padding:0 26px}
.next-card .btn-coral[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.next-card .links{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:15px}
.next-card .links button{background:none;border:0;padding:0;color:var(--on-navy);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.page{padding:36px 0 64px}
.page h1{font-size:clamp(30px,4vw,40px)}
.page .intro{color:var(--muted);margin:8px 0 26px;max-width:62ch}
.back{background:none;border:0;padding:0;margin-bottom:18px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:15px}
.layout{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start}
.bk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.bk-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:12px}
.bk-head .t{font-size:14px;color:var(--muted)}
.bk-head .n{font-weight:700;font-size:19px}
.bk-head .price{font-weight:700;font-size:19px;white-space:nowrap}
.bk .grid2 .field{margin-bottom:10px}
.bk textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);resize:vertical}
.bk textarea:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px var(--tint)}
.later{background:var(--surface);border-radius:12px;padding:16px 20px;color:var(--muted);font-size:15px}
.later b{color:var(--ink)}
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:var(--surface);border-radius:14px;padding:22px}
.summary h2{font-size:22px;margin-bottom:12px}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:15px}
.sumrow.total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-weight:700;font-size:18px}
.contact{font-size:15px;margin:16px 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.contact .k{color:var(--muted);font-size:13px}
.summary .optin{margin:14px 0}
.summary .btn-coral{font-size:17px}
.form-err{color:var(--coral-text);font-size:14px;margin:0 0 10px}
.conf-hero{background:var(--navy);color:var(--on-navy);padding:40px 0 44px}
.conf-hero h1{font-size:clamp(32px,5vw,48px)}
.conf-hero p{color:var(--on-navy-muted);margin:10px 0 0;max-width:60ch}
.conf-list{list-style:none;margin:0 0 30px;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.conf-list li{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:16px 20px;border-top:1px solid var(--line);background:var(--card)}
.conf-list li:first-child{border-top:0}
.conf-list .n{font-weight:700;font-size:18px}
.conf-list .m{color:var(--muted);font-size:15px}
.conf-list .code{font-weight:700;text-align:right}
.conf-list .code small{display:block;font-weight:400;color:var(--coral-text);font-size:13px}
.steps-list{margin:0 0 30px;padding-left:22px;max-width:64ch}
.steps-list li{margin-bottom:10px;padding-left:4px}
.steps-list b{display:block}
.steps-list span{color:var(--muted);font-size:15px}
.todo{margin:6px 0 30px}
.todo-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:760px}
.todo-list li{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border-top:1px solid var(--line);background:var(--card)}
.todo-list li:first-child{border-top:0}
.todo-main{display:flex;flex-direction:column;cursor:pointer}
.todo-main .n{font-weight:700}
.todo-main .m{color:var(--muted);font-size:14px}
.todo-main .late{color:var(--coral-text);font-weight:700}
.bk-actions{display:flex;flex-wrap:wrap;gap:4px 18px}
.toggle.danger{color:var(--coral-text)!important}
.page h2.sec{font-size:24px;margin:0 0 14px}
.btn-navy{background:var(--navy);color:var(--on-navy)}
:root[data-theme="dark"] .btn-navy{background:var(--coral);color:var(--navy-deep)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-navy{background:var(--coral);color:var(--navy-deep)}}
@media (max-width: 820px){
  .layout{grid-template-columns:1fr}
  .summary{position:static}
  .next-card{grid-template-columns:1fr}
  .next-card .btn-coral{width:100%}
}
/* Landing */
.lp-nav{background:var(--navy);color:var(--on-navy)}
.lp-nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:18px;padding-bottom:18px}
.lp-nav .links{display:flex;align-items:center;gap:22px}
.lp-nav a{color:var(--on-navy-muted);text-decoration:none;font-size:16px}
.lp-nav a:hover{color:var(--on-navy)}
.lp-hero{background:var(--navy);color:var(--on-navy);padding:40px 0 88px;position:relative;overflow:hidden}
.lp-hero::after{content:"";position:absolute;right:-180px;top:-160px;width:520px;height:520px;border-radius:50%;background:var(--navy-deep);z-index:0}
.lp-hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center}
.lp-hero h1{font-size:clamp(40px,6vw,68px);letter-spacing:-.015em;max-width:11ch}
.lp-hero h1 em{font-style:normal;color:var(--coral)}
.lp-hero .lede{font-size:20px;color:var(--on-navy-muted);max-width:42ch;margin:20px 0 30px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.cta-row .btn-coral{width:auto;padding:0 28px;height:54px}
.cta-row .ghost-link{color:var(--on-navy);font-weight:700;text-decoration:underline;text-underline-offset:4px;background:none;border:0;cursor:pointer;padding:0}
.cta-note{font-size:14px;color:var(--on-navy-muted);margin-top:14px}
.preview{background:var(--card);color:var(--ink);border-radius:16px;padding:22px;box-shadow:0 30px 70px rgba(6,10,40,.45);transform:rotate(1.2deg)}
.preview .k{font-size:13px;color:var(--coral-text);font-weight:700}

<script>
const ACCESS = {ground:["Ground floor, no stairs",1],elevator:["Elevator",1.05],stairs:["Stairs",1.12]};
const SIZES = {studio:["Studio",0.6],"1br":["1 bedroom",0.8],"2br":["2 bedrooms",1],"3br":["3 bedrooms",1.35],"4br":["4+ bedrooms",1.7]};

// scale: which factors affect price. offset: days relative to move date (negative = before).
const TASKS = [
  {id:"notice", title:"Give notice to your landlord", offset:-60, note:"Check your lease for the notice period and move-out rules.", fixed:0},

    {id:"citynet", name:"CityNet Cable", desc:"Cable internet, self-install kit shipped to you.", rating:"4.3", count:"1,340 installs", base:65},
    {id:"wave", name:"MetroWave 5G Home", desc:"Plug-in 5G router, no install appointment.", rating:"4.4", count:"620 setups", base:55}]},
  {id:"utilities", title:"Transfer electricity and gas", offset:-14, note:"Schedule shutoff for the day after you leave and start service the day before you arrive.", fixed:0},
  {id:"mail", title:"Forward your mail", offset:-14, note:"File a change of address online; there is a small identity check fee.", fixed:1},
  {id:"cleaning", title:"Book move-out cleaning", offset:-10, service:{day:0, win:"afternoon", label:"Cleaning date"}, scale:["size"], providers:[
    {id:"sparkle", name:"Sparkle Cleaning", desc:"Deep move-out clean, deposit-return checklist included.", rating:"4.8", count:"450 cleans", base:180},
    {id:"fresh", name:"Fresh Start Crew", desc:"Deep clean plus inside appliances and windows.", rating:"4.9", count:"233 cleans", base:240},
    {id:"tidy", name:"Tidy Exit", desc:"Standard clean for kitchens, baths and floors.", rating:"4.5", count:"610 cleans", base:130}]},
  {id:"repairs", title:"Patch walls and fix small damage", offset:-7, service:{day:-3, win:"any", label:"Visit date"}, scale:["sqrt"], providers:[
    {id:"handy", name:"HandyPro", desc:"Two-hour visit: patch holes, touch-up paint, fixtures.", rating:"4.7", count:"380 visits", base:160},
    {id:"fixit", name:"FixIt Same Week", desc:"Fixed-price wall patching, booked within 7 days.", rating:"4.5", count:"270 visits", base:120}]},
  {id:"moveday", title:"Move day", offset:0, note:"Final walkthrough, photos of the empty place, keys returned.", fixed:0},
  {id:"license", title:"Update your license and registration", offset:30, note:"Most states give you 30 to 60 days after you move. Fees vary by state.", fixed:null}
];

const KEY = "moveme-plan-v1";
let state = load() || {move:null, picks:{}, done:{}, open:null};
state.bookings = state.bookings || {};
state.custom = state.custom || [];
state.providers = state.providers || [];  // provider accounts created this session
state.provider = null;                    // signed-in provider
state.signedIn = false;                   // customer signed in
state.uid = null;                         // signed-in customer id

// Every visit starts fresh: nothing is read from or written to browser storage.
// Any data saved by earlier versions of the app is cleared on open.
function load(){ try{ localStorage.removeItem(KEY); }catch(e){} return null; }

/* ---------- Database (Supabase) ---------- */
// The publishable key is meant to be public; row-level security in the database
// makes sure each person can only read and change their own records.
const SUPABASE_URL = "https://dgqylxsrfsskiuxwvbsh.supabase.co";
const SUPABASE_KEY = "sb_publishable_EDSe_zZcKjLyLVYyb3rjVw_6hmT37ZI";
let sb = null;
try{
  if(window.supabase) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth:{ persistSession:false, autoRefreshToken:true, detectSessionInUrl:false } // every visit starts signed out
  });
}catch(e){ sb = null; }
const DB_DOWN = "We can't reach the Move Me database right now. Check your connection and try again.";
function planPayload(){ return {move:state.move, picks:state.picks, done:state.done, custom:state.custom, bookings:state.bookings}; }
let saveTimer = null;
function save(){
  if(!sb || !state.signedIn || !state.uid) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const {error} = await sb.from("move_plans").upsert({customer_id:state.uid, plan:planPayload(), updated_at:new Date().toISOString()});
    if(error) toast("Couldn't save your latest changes. Check your connection.");
  }, 500);
}
function toast(msg){
  let t = document.getElementById("toast");
  if(!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 4500);
}
function busy(btn, on, label){
  if(!btn) return;
  if(on){ btn.dataset.label = btn.textContent; btn.textContent = label; btn.disabled = true; }
  else { btn.textContent = btn.dataset.label || btn.textContent; btn.disabled = false; }
}
function freshPlan(){ return {move:null, picks:{}, done:{}, bookings:{}, custom:[], open:null, draft:{}, returnTo:null}; }
function providerFromRow(r){ return {business:r.business_name, type:r.provider_type, name:r.contact_name, area:r.service_area, email:r.email, phone:r.phone, status:r.status}; }
function authMessage(error){
  const m = (error && error.message || "").toLowerCase();
  if(m.includes("already registered") || m.includes("already been registered")) return "exists";
  if(m.includes("email not confirmed")) return "Confirm your email first. Check your inbox for the link from Move Me, then sign in.";
  if(m.includes("invalid login")) return "That email and password don't match an account. Check them and try again.";
  if(m.includes("rate limit") || m.includes("too many")) return "Too many attempts. Wait a few minutes and try again.";
  if(m.includes("fetch") || m.includes("network")) return DB_DOWN;
  return (error && error.message) || DB_DOWN;
}
async function signOutAll(){ clearTimeout(saveTimer); if(sb) try{ await sb.auth.signOut(); }catch(e){} state = {...state, ...freshPlan(), user:null, uid:null, signedIn:false, provider:null}; }

/* Shown when Supabase asks the person to confirm their email before signing in. */
function renderCheckEmail(kind, email){
  document.getElementById("app").innerHTML = `
  <section class="setup">
    <div class="wrap setup-top"><button type="button" class="mark" data-home aria-label="Move Me home"><i aria-hidden="true"></i>Move Me</button></div>
    <div class="wrap setup-main">
      <div>
        <h1>Check your email.</h1>
        <p class="lede">We sent a confirmation link to <b>${esc(email)}</b>. Open it to confirm your ${kind === "provider" ? "provider " : ""}account, then come back and sign in.</p>
      </div>
      <div class="form-card">
        <h2>Almost there</h2>
        <p class="hint">Can't find it? Check your spam folder. The link comes from Supabase on behalf of Move Me.</p>
        <button class="btn btn-coral" data-login="${kind}">Go to ${kind === "provider" ? "provider" : "customer"} sign in</button>
      </div>
    </div>
  </section>`;
}

const today = (()=>{ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); })();
function parseDate(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function daysBetween(a,b){ return Math.round((b - a) / 86400000); }
const money = n => "$" + Math.round(n).toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
const fmtLong = d => d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});

function price(task, p){
  const m = state.move; let f = 1;
  (task.scale||[]).forEach(s=>{
    if(s==="size") f *= SIZES[m.size][1];
    if(s==="access") f *= ACCESS[m.accessFrom||"ground"][1] * ACCESS[m.accessTo||"ground"][1];
    if(s==="sqrt") f *= Math.sqrt(SIZES[m.size][1]);
  });
  return Math.max(5, Math.round(p.base * f / 5) * 5);
}
function accessText(m){
  const a = k => k==="stairs" ? "stairs" : k==="elevator" ? "elevator" : "ground floor";
  return "From: " + a(m.accessFrom||"ground") + ", to: " + a(m.accessTo||"ground");
}
function taskCost(task){
  if(task.providers){
    const bk = state.bookings[task.id];
    if(bk){ const pk = task.providers.find(p=>p.id===bk.provider); const prices = task.providers.map(p=>price(task,p)); return {chosen: bk.price, pick: pk, booked: bk, low: Math.min(...prices), high: Math.max(...prices)}; }
    const prices = task.providers.map(p=>price(task,p));
    if(state.picks[task.id] === "diy") return {chosen: 0, pick: null, diy: true, low: Math.min(...prices), high: Math.max(...prices)};
    const pick = task.providers.find(p=>p.id===state.picks[task.id]);
    return {chosen: pick ? price(task,pick) : null, pick, low: Math.min(...prices), high: Math.max(...prices)};
  }
  return {chosen: task.fixed, fixedOnly:true};
}
/* A real build would poll the provider's system; here a request simply "confirms" a few seconds after it's sent. */
function bookingStatus(b){ return b && (Date.now() - (b.at || 0)) >= 6000 ? "confirmed" : "requested"; }
function isTaskDone(t){
  if(t.providers){ const b = state.bookings[t.id]; if(!b && state.picks[t.id] === "diy") return !!state.done[t.id]; return b ? bookingStatus(b) === "confirmed" : false; }
  return !!state.done[t.id];
}
function allTasks(){
  const move = parseDate(state.move.date);
  const extra = (state.custom||[]).map(c => ({id:c.id, title:c.title, offset:daysBetween(move, parseDate(c.date)), note:"Your own task.", fixed:c.cost||0, custom:true}));
  return TASKS.concat(extra).sort((a,b)=>a.offset-b.offset);
}
function relText(n, isDone){
  if(isDone) return {t:"Done", late:false};
  if(n === 0) return {t:"Today", late:false};
  if(n < 0) return {t: (n===-1 ? "1 day" : (-n)+" days") + " overdue", late:true};
  if(n === 1) return {t:"Tomorrow", late:false};
  if(n < 14) return {t:"In "+n+" days", late:false};
  return {t:"In "+Math.round(n/7)+" weeks", late:false};

  <section class="lp-sec" aria-labelledby="prob-h"><div class="wrap">
    <p class="kicker">The problem</p>
    <h2 id="prob-h">Moving is simple to describe, and painful to actually do.</h2>
    <div class="problem">
      <div class="problem-points">
        <p>It's never just “hire a mover.” One move can mean movers, packing, cleaning, storage, junk removal and setting up utilities.</p>
        <p>Most people coordinate all of it themselves, across different websites, apps, calls and emails, with no shared timeline or budget.</p>
        <p>Nothing tells you what you need, when, or what it should cost. Tasks get missed, deadlines slip and costs arrive as surprises.</p>
      </div>
      <div class="juggle">
        <h3>Six or more separate things to juggle</h3>
        <ul>
          <li>${ic("truck",1)}Movers</li><li>${ic("boxes",1)}Packing</li><li>${ic("checklist",1)}Cleaning</li>
          <li>${ic("route",1)}Storage</li><li>${ic("dollar",1)}Utilities</li><li>${ic("calendar",1)}Junk removal</li>
        </ul>
      </div>
    </div>
  </div></section>

  <section class="lp-sec alt" id="how" aria-labelledby="how-h"><div class="wrap">
    <p class="kicker">How it works</p>
    <h2 id="how-h">From a few details to a full plan.</h2>
    <div class="steps3">
      <div class="step">${ic("calendar",1)}<div class="num">Step 1</div><h3>Tell us about your move</h3><p>Where you're moving from and to, your move date and home size.</p></div>
      <div class="step">${ic("checklist",1)}<div class="num">Step 2</div><h3>Get a personalized plan</h3><p>A timeline, checklist, estimated costs and a short list of vetted providers to choose from for each task.</p></div>
      <div class="step">${ic("route",1)}<div class="num">Step 3</div><h3>Manage it all in one place</h3><p>Tasks, bookings, deadlines and costs stay together. Adjust as things change.</p></div>
    </div>
  </div></section>

  <section class="lp-sec" id="why" aria-labelledby="why-h"><div class="wrap">
    <p class="kicker">Why Move Me</p>
    <h2 id="why-h">Not another listings site.</h2>
    <p class="sec-lede">Other tools cover pieces of a move, like vendor lists through a property manager or a paid concierge. Move Me is self-serve and built around your own plan.</p>
    <div class="compare">
      <div class="col old"><h3>The typical approach</h3><ul>
        <li><span class="x" aria-label="Without Move Me">✕</span><span>Search separate sites and apps for each service</span></li>
        <li><span class="x" aria-label="Without Move Me">✕</span><span>Piece together your own timeline and budget</span></li>
        <li><span class="x" aria-label="Without Move Me">✕</span><span>Re-plan everything by hand when something changes</span></li>
        <li><span class="x" aria-label="Without Move Me">✕</span><span>No single view of what's booked, due or spent</span></li></ul></div>
      <div class="col new"><h3>The Move Me approach</h3><ul>
        <li><span class="y" aria-label="With Move Me">✓</span><span>One plan built around your move, not a directory to search</span></li>
        <li><span class="y" aria-label="With Move Me">✓</span><span>Clear answers: what you need, when, at what cost, from whom</span></li>
        <li><span class="y" aria-label="With Move Me">✓</span><span>Update your plan when things change. It adjusts; you don't rebuild</span></li>
        <li><span class="y" aria-label="With Move Me">✓</span><span>Tasks, bookings, deadlines and costs in one place</span></li></ul></div>
    </div>
  </div></section>

  <section class="lp-sec alt" aria-labelledby="val-h"><div class="wrap">
    <p class="kicker">What changes</p>
    <h2 id="val-h">Moving with Move Me feels different.</h2>
    <div class="values">
      <div class="value">${ic("checklist",1)}<div><h3>Less falls through the cracks</h3><p>One shared timeline and checklist instead of scattered tabs, texts and reminders.</p></div></div>
      <div class="value">${ic("dollar",1)}<div><h3>Costs are clear up front</h3><p>A realistic estimate before you commit, instead of surprises as the bills come in.</p></div></div>
      <div class="value">${ic("route",1)}<div><h3>Less time coordinating</h3><p>A plan that already knows what you need and when, so you're not researching from scratch.</p></div></div>
      <div class="value">${ic("bulb",1)}<div><h3>More confidence in each choice</h3><p>Every task points to vetted services, so decisions feel guided, not guessed at.</p></div></div>
    </div>
  </div></section>

  <section class="lp-sec" aria-labelledby="who-h"><div class="wrap">
    <div class="forwho">${ic("users",1)}<div>
      <h2 id="who-h">Made for people who move often.</h2>
      <p>Students, renters and young professionals feel every part of the hassle, and would rather plan and book online than chase quotes by phone. If that's you, Move Me was built with you in mind.</p>
    </div></div>
  </div></section>

  <section class="lp-final" aria-labelledby="fin-h"><div class="wrap">
    <h2 id="fin-h">Stop juggling. Start your plan.</h2>
    <p>Create your account, tell us about your move, and see your full timeline and total estimate in about a minute.</p>
    <div class="cta-row"><button class="btn btn-coral" data-start>${cta}</button></div>
  </div></section>
  </main>
  <footer class="lp-foot"><div class="wrap"><span>Move Me · Team 4PM</span><button type="button" class="foot-link" data-provsignup>Are you a mover, packer or service provider? Join Move Me</button><span>Prototype. Providers and prices shown are sample data.</span></div></footer>`;

/* ---------- Sign in (customers and providers) ---------- */
// Accounts only exist while this page is open; nothing is stored or sent.
function renderSignIn(kind){
  const prov = kind === "provider";
  document.getElementById("app").innerHTML = `
  <section class="setup">
    <div class="wrap setup-top"><button type="button" class="mark" data-home aria-label="Move Me home"><i aria-hidden="true"></i>Move Me</button></div>
    <div class="wrap setup-main">
      <div>
        <p class="steps">${prov ? "For providers" : "For customers"}</p>
        <h1>${prov ? "Welcome back, partner." : "Welcome back."}</h1>
        <p class="lede">${prov ? "Sign in to manage your Move Me provider profile and booking requests." : "Sign in to pick up your move plan, bookings and to do list where you left off."}</p>
      </div>
      <form class="form-card" id="signin" novalidate>
        <h2>${prov ? "Provider sign in" : "Customer sign in"}</h2>
        <p class="hint">${prov ? "Use the email you registered your business with." : "Use the email you signed up with."}</p>
        <div class="field" data-f="si-email"><label for="si-email">Email</label><input id="si-email" type="email" autocomplete="email" inputmode="email" placeholder="${prov ? "you@yourbusiness.com" : "you@example.com"}"><span class="err" aria-live="polite"></span></div>
        <div class="field" data-f="si-pw"><label for="si-pw">Password</label><input id="si-pw" type="password" autocomplete="current-password"><span class="err" aria-live="polite"></span></div>
        <p class="form-err" id="si-err" role="alert" hidden></p>
        <button class="btn btn-coral" type="submit">Sign in</button>
        <p class="fineprint">
          ${prov ? `New provider? <button type="button" class="clear" data-provsignup>Join Move Me as a provider</button><br>Moving? <button type="button" class="clear" data-login="customer">Customer sign in</button>`
                 : `New to Move Me? <button type="button" class="clear" data-newcust>Create an account</button><br>Are you a provider? <button type="button" class="clear" data-login="provider">Provider sign in</button>`}
          <br>For your security, you'll need to sign in again each time you open Move Me.
        </p>
      </form>
    </div>
  </section>`;
  const form = document.getElementById("signin");
  form.querySelectorAll("input").forEach(i=>i.addEventListener("input",()=>{ const f=i.closest(".field"); f.classList.remove("bad"); f.querySelector(".err").textContent=""; document.getElementById("si-err").hidden = true; }));
  form.addEventListener("submit", async e=>{
    e.preventDefault();

function formatPhone(raw){
  let d = raw.replace(/\D/g,"");
  if(d.length === 11 && d[0] === "1") d = d.slice(1);
  if(d.length !== 10) return null;
  return "("+d.slice(0,3)+") "+d.slice(3,6)+"-"+d.slice(6);
}

// Match a saved city (even one typed before the dropdowns existed) to a list value; never leave it blank.
function matchCity(saved, fallback){
  const v = String(saved||"").toLowerCase();

}
function cityOptions(sel, fallback){

}

const WINDOWS = {morning:"8 am to noon", afternoon:"noon to 5 pm", any:"any time"};
function bookable(){ return TASKS.filter(t=>t.providers); }
function nextSteps(){
  const all = bookable();
  const booked = all.filter(t=>state.bookings[t.id]);
  const ready = all.filter(t=>!state.bookings[t.id] && state.picks[t.id] && state.picks[t.id] !== "diy");
  const open = all.filter(t=>!state.bookings[t.id] && !state.picks[t.id]);
  const diy = all.filter(t=>!state.bookings[t.id] && state.picks[t.id] === "diy");
  const settled = booked.length + diy.length === all.length;
  let h, p;
  if(settled){ h = diy.length ? "Everything is covered" : "Everything is booked"; p = diy.length ? `${booked.length ? `Your providers have your details, and you're` : "You're"} handling ${diy.length} task${diy.length>1?"s":""} yourself. Keep checking things off as move day gets closer.` : "All your providers have your details. Keep checking off the rest of your plan as move day gets closer."; }
  else if(ready.length){ h = booked.length ? "Book the rest of your providers" : "Next step: finalize your bookings"; p = `You've chosen ${ready.length} provider${ready.length>1?"s":""} ready to book${open.length ? `, and ${open.length} task${open.length>1?"s":""} still need${open.length>1?"":"s"} a choice. You can book now and come back for the rest` : ""}.`; }

function confirmBookings(){

/* ---------- Plan screen ---------- */
function totals(){
  let spent = 0, projected = 0;
  allTasks().forEach(t=>{
    const c = taskCost(t);
    if(c.fixedOnly){ if(c.chosen) spent += c.chosen; }
    else if(c.chosen != null) spent += c.chosen;
    else projected += (c.low + c.high) / 2;
  });
  return {spent, projected};
}

function renderPlan(){
  const m = state.move, move = parseDate(m.date);

    } else {

        ${t.providers.map(p=>{ const sel = state.picks[t.id]===p.id; const isCurrent = c.booked && c.booked.provider===p.id; return `
          <label class="opt ${sel?"sel":""}">

            <span><span class="n">${esc(p.name)}${isCurrent?' <span class="tag">Current</span>':""}</span><br><span class="desc">${esc(p.desc)}</span><br><span class="meta">Rated ${p.rating} of 5 · ${p.count}</span></span>
            <span class="price">${money(price(t,p))}</span>
          </label>`}).join("")}
        </fieldset>
        ${c.booked
          ? (state.picks[t.id] === "diy"
              ? `<div class="swap-row"><button type="button" class="btn btn-coral" data-diyswitch="${t.id}">Cancel ${esc(c.pick.name)} and do it myself</button><button type="button" class="clear" data-toggle="${t.id}">Keep ${esc(c.pick.name)}</button></div>`
            : state.picks[t.id] && state.picks[t.id] !== c.booked.provider
              ? (()=>{ const np = t.providers.find(x=>x.id===state.picks[t.id]); const delta = price(t,np) - c.booked.price; const d = delta===0 ? "same price" : (delta>0?"+":"-")+money(Math.abs(delta));
                return `<div class="swap-row"><button type="button" class="btn btn-coral" data-swap="${t.id}">Switch to ${esc(np.name)} (${d})</button><button type="button" class="clear" data-toggle="${t.id}">Keep ${esc(c.pick.name)}</button></div>`; })()
              : `<p class="hint">Still with ${esc(c.pick.name)}. Pick a different option above to switch.</p>`)
          : (state.picks[t.id] ? `<button type="button" class="clear" id="clr-${t.id}" data-clear="${t.id}">Clear my choice</button>` : "")}

    return `

            ${t.providers && !c.booked ? `<button type="button" class="toggle" id="t-${t.id}" data-toggle="${t.id}" aria-expanded="${open}" aria-controls="sl-${t.id}">${open ? "Hide options" : c.diy ? "Change choice" : c.pick ? "Change provider" : "Compare options"}</button>` : ""}
          </div>
          <div class="est">${est}</div>
        </div>${shortlist}
      </div></div>
    </li>`;
  }).join("");

  const moveLabel = days > 1 ? `<div class="v">${days} <small>days</small></div>` : days === 1 ? `<div class="v">1 <small>day</small></div>` : days === 0 ? `<div class="v">Today</div>` : `<div class="v">${-days} <small>days ago</small></div>`;

  document.getElementById("app").innerHTML = `
  <header class="topbar"><div class="wrap">
    <button type="button" class="mark" data-home aria-label="Move Me home"><i aria-hidden="true"></i>Move Me</button>

  </div></header>
  <section class="hero"><div class="wrap">
    <h1 class="route"><span>${esc(m.from)}</span><span class="arrow" aria-label="to">→</span><span class="to">${esc(m.to)}</span></h1>
    <div class="route-meta">${fmtLong(move)} · ${SIZES[m.size][0]} · ${accessText(m)}</div>
    <div class="stats">

      <div class="stat budget">
        <div class="k">Total estimate</div>
        <div class="v">${money(total)} <small>for your whole move</small></div>
        <div class="meter" role="img" aria-label="${money(spent)} from chosen providers and ${money(projected)} still estimated, of a ${money(total)} total estimate">

          <span><span class="sw" style="background:rgba(249,97,103,.45)"></span><b>${money(projected)}</b> still estimated</span>
        </div>
      </div>
      <div class="stat"><div class="k">Tasks done</div><div class="v">${doneCount} <small>of ${AT.length}</small></div></div>

  <main class="plan"><div class="wrap">

document.addEventListener("submit", e=>{
  if(e.target.id !== "addtask") return;
  e.preventDefault();
  const t = document.getElementById("ctitle").value.trim(), d = document.getElementById("cdate").value, costEl = document.getElementById("ccost");
  const cost = Math.max(0, Math.round(Number(costEl.value) || 0));
  const err = document.getElementById("cerr");
  if(!t || !d){ err.textContent = "Add a task name and a due date."; return; }
  err.textContent = "";
  state.custom.push({id:"c"+Date.now(), title:t, date:d, cost});
  rerender();
}, true);
function rerender(){
  const id = document.activeElement && document.activeElement.id;
  save(); renderPlan();
  if(id){ const el = document.getElementById(id); if(el) el.focus({preventScroll:true}); }
  if(Object.values(state.bookings).some(b=>bookingStatus(b)==="requested")){
    setTimeout(()=>{ if(document.querySelector(".plan")) renderPlan(); }, 6200);
  }
}

function closeConfirm(){
  const root = document.getElementById("modal-root");
  root.innerHTML = "";
  document.removeEventListener("keydown", onConfirmKey, true);
  if(window.__lastFocus){ window.__lastFocus.focus({preventScroll:true}); window.__lastFocus = null; }
}
function onConfirmKey(e){
  if(e.key === "Escape"){ e.preventDefault(); closeConfirm(); return; }
  if(e.key === "Tab"){
    const box = document.querySelector(".confirm-box"); if(!box) return;
    const items = [...box.querySelectorAll("button")]; if(!items.length) return;
    const first = items[0], last = items[items.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
}
function showConfirm({title, body, confirmLabel, cancelLabel, danger, onConfirm}){
  window.__lastFocus = document.activeElement;
  const root = document.getElementById("modal-root");
  root.innerHTML = `
  <div class="confirm-backdrop" data-confirm-backdrop>
    <div class="confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-body">
      <h2 id="confirm-title">${esc(title)}</h2>
      <p id="confirm-body">${esc(body)}</p>
      <div class="confirm-actions">
        <button type="button" class="btn btn-line" data-confirm-cancel>${esc(cancelLabel || "Never mind")}</button>
        <button type="button" class="btn ${danger ? "btn-danger" : "btn-coral"}" data-confirm-ok>${esc(confirmLabel || "Confirm")}</button>
      </div>
    </div>
  </div>`;
  document.addEventListener("keydown", onConfirmKey, true);
  root.querySelector("[data-confirm-backdrop]").addEventListener("click", e=>{ if(e.target.dataset.confirmBackdrop !== undefined && e.target === e.currentTarget) closeConfirm(); });
  root.querySelector("[data-confirm-cancel]").addEventListener("click", closeConfirm);
  root.querySelector("[data-confirm-ok]").addEventListener("click", ()=>{ closeConfirm(); onConfirm(); });
  root.querySelector("[data-confirm-ok]").focus();
}
document.addEventListener("keydown", e=>{
  if((e.key === "Enter" || e.key === " ") && e.target.closest("[data-toggle]") && e.target.getAttribute("role") === "button"){
    e.preventDefault(); const t = e.target.closest("[data-toggle]");
    state.open = state.open === t.dataset.toggle ? null : t.dataset.toggle; rerender();
  }
});
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-toggle]");
  if(t){ state.open = state.open === t.dataset.toggle ? null : t.dataset.toggle; rerender(); return; }
  if(e.target.closest("[data-start]")){ !state.signedIn ? renderRegister() : state.move ? renderPlan() : renderSetup(); window.scrollTo(0,0); return; }
  const lg = e.target.closest("[data-login]");
  if(lg){ renderSignIn(lg.dataset.login); window.scrollTo(0,0); return; }
  if(e.target.closest("[data-newcust]")){ signOutAll().then(()=>{ renderRegister(); window.scrollTo(0,0); }); return; }
  if(e.target.closest("[data-provsignup]")){ renderProviderSignup(); window.scrollTo(0,0); return; }
  if(e.target.closest("[data-signout]") || e.target.closest("[data-provsignout]")){ signOutAll().then(()=>{ renderLanding(); window.scrollTo(0,0); }); return; }
  if(e.target.closest("[data-home]")){ renderLanding(); window.scrollTo(0,0); return; }
  const rmv = e.target.closest("[data-remove]");
  if(rmv){ const id = rmv.dataset.remove; state.custom = state.custom.filter(c=>c.id!==id); delete state.done[id]; rerender(); return; }
  const sw = e.target.closest("[data-swap]");
  if(sw){ const tid = sw.dataset.swap, t = TASKS.find(x=>x.id===tid), np = t.providers.find(x=>x.id===state.picks[tid]), old = state.bookings[tid];
    const conf = "MM-" + Math.random().toString(36).slice(2,8).toUpperCase();
    state.bookings[tid] = {...old, provider:np.id, price:price(t,np), conf, at:Date.now()};
    state.open = null; rerender(); const btn=document.getElementById(`chg-${tid}`); if(btn) btn.focus({preventScroll:true});
    return; }
  const dsw = e.target.closest("[data-diyswitch]");
  if(dsw){ const tid = dsw.dataset.diyswitch, t = TASKS.find(x=>x.id===tid), b = state.bookings[tid], p = t.providers.find(x=>x.id===b.provider);
    showConfirm({
      title: "Do this task yourself?",
      body: `Your booking with ${p.name} (${b.conf}) will be cancelled, and the task stays on your plan for you to handle.`,
      confirmLabel: "Cancel booking",
      danger: true,
      onConfirm(){ delete state.bookings[tid]; state.picks[tid] = "diy"; state.done[tid] = false; state.open = null; rerender(); }
    });
    return; }
  const cx = e.target.closest("[data-cancel]");
  if(cx){ const tid = cx.dataset.cancel, t = TASKS.find(x=>x.id===tid), b = state.bookings[tid], p = t.providers.find(x=>x.id===b.provider);
    showConfirm({
      title: "Cancel this booking?",
      body: `Cancel your booking with ${p.name} (${b.conf})? The task goes back on your plan with no provider chosen.`,
      confirmLabel: "Cancel booking",
      danger: true,
      onConfirm(){ delete state.bookings[tid]; delete state.picks[tid]; state.done[tid] = false; rerender(); const tg=document.getElementById("t-"+tid); if(tg) tg.focus({preventScroll:true}); }
    });
    return; }
  const cl = e.target.closest("[data-clear]");
  if(cl){ const id = cl.dataset.clear; delete state.picks[id]; rerender(); const tg=document.getElementById("t-"+id); if(tg) tg.focus({preventScroll:true}); return; }
  const id = e.target.id;
  if(id === "review"){ state.draft = {}; renderReview(); window.scrollTo(0,0); return; }
  if(id === "viewbk"){ renderConfirmation(null); window.scrollTo(0,0); return; }
  if(id === "toplan" || id === "toplan2" || id === "toplan3"){ if(document.querySelector("[data-draft]")) { syncDraft(); save(); } renderPlan(); window.scrollTo(0,0); return; }
  if(id === "confirm"){ confirmBookings(); return; }
  if(id === "editacct"){ syncDraft(); save(); state.returnTo = "review"; renderRegister(); window.scrollTo(0,0); return; }
  if(e.target.id === "account"){ renderRegister(); window.scrollTo(0,0); document.getElementById("name").focus(); return; }
  if(e.target.id === "edit"){ renderSetup(); window.scrollTo(0,0); document.getElementById("from").focus(); return; }
  if(e.target.id === "reset"){
    showConfirm({
      title: "Start a new plan?",
      body: "This clears your move details, choices, bookings and progress. Your account stays.",
      confirmLabel: "Start over",
      danger: true,
      onConfirm(){ state = {...state, move:null, picks:{}, done:{}, bookings:{}, custom:[], open:null}; save(); renderSetup(); window.scrollTo(0,0); }
    });
  }
});
document.addEventListener("change", e=>{
  const el = e.target;
  if(el.dataset.todo){ state.done[el.dataset.todo] = true; save(); renderConfirmation(); const n=document.querySelector("[data-todo]"); (n||document.getElementById("toplan3")).focus({preventScroll:true}); return; }
  if(el.dataset.done){ state.done[el.dataset.done] = el.checked; rerender(); }
  else if(el.dataset.task){ state.picks[el.dataset.task] = el.value; rerender(); }
});

renderLanding();
</script>
</body>
</html>
